<!DOCTYPE html>
<html lang="pt-br">

<head>

<body>
    
    <h1>Agendamento</h1>

    <input type="text" id="telefone" placeholder="Seu telefone">

    <label for="cpf"> Cpf</label>
    <input type="text" id="cpf" placeholder="Digite seu CPF">

    <form action="" method="get">
        <label for="datetime-local">Data e horas</label>
        <input id="dataHora" type="datetime-local"><br>
        


        <label for="datetime-local">Profissional</label>


        <select class="profissional"
        id="profissional">
            <option value="">--Selecione</option>
            <option value="erick">Erick</option>
            <option value="vitor">Vitor</option>
        </select>
        </label>
<label for="datetime-local">Serviços</label>


        <select class="servico"
        id="servico">
            <option value="">--Selecione</option>
            <option value="cabelo e barba">Cabelo e Barba</option>
            <option value="barba">Barba</option>
            <option value="cabelo">Cabelo</option>
        </select>
        </label>
    </form>
    <button onclick="agendar()">Agendar</button>
    <div class="Agendamento" id="listaAgendamentos">
        <h3>lista de Agendamentos</h3>
    </div>
